<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ea6"/>
      <stop offset="50%" stop-color="#004B8D"/>
      <stop offset="100%" stop-color="#002d57"/>
    </linearGradient>
    <linearGradient id="goldGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B82A"/>
      <stop offset="100%" stop-color="#D99B09"/>
    </linearGradient>
  </defs>

  <!-- iOS auto-clips corners, solid background -->
  <rect width="180" height="180" fill="url(#bgGradApple)"/>

  <!-- Shield -->
  <path d="M 90 28 
           L 134 48 
           C 134 92, 115 126, 90 142 
           C 65 126, 46 92, 46 48 
           Z" 
        fill="#ffffff" />

  <path d="M 90 36 
           L 127 52 
           C 127 90, 111 120, 90 134 
           C 69 120, 53 90, 53 52 
           Z" 
        fill="#004B8D" />

  <!-- Gold Checkmark -->
  <path d="M 72 84 L 85 98 L 109 70" stroke="url(#goldGradApple)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- Badge banner -->
  <g transform="translate(90, 154)">
    <rect x="-50" y="-9" width="100" height="18" rx="9" fill="url(#goldGradApple)"/>
    <text x="0" y="4" fill="#002D57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Public Sans', sans-serif" font-size="8" font-weight="900" text-anchor="middle" letter-spacing="1.5">
      CREA-PI
    </text>
  </g>
</svg>

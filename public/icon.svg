<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ea6"/>
      <stop offset="50%" stop-color="#004B8D"/>
      <stop offset="100%" stop-color="#002d57"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B82A"/>
      <stop offset="100%" stop-color="#D99B09"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background base rounded -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle radial ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="white" stroke-width="4" opacity="0.08"/>

  <!-- Main Shield -->
  <g filter="url(#shadow)">
    <path d="M 256 90 
             L 370 140 
             C 370 250, 320 340, 256 385 
             C 192 340, 142 250, 142 140 
             Z" 
          fill="#ffffff" />
    
    <path d="M 256 108 
             L 354 150 
             C 354 246, 310 326, 256 366 
             C 202 326, 158 246, 158 150 
             Z" 
          fill="#004B8D" />
  </g>

  <!-- Engineering Cog / Seal Accent inside shield -->
  <g transform="translate(256, 225) scale(0.95)" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round">
    <!-- Golden checkmark inside -->
    <path d="M -42 4 L -10 38 L 46 -30" stroke="#F5B82A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  </g>

  <!-- CREA-PI Badge Banner -->
  <g transform="translate(256, 424)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <text x="0" y="7" fill="#002D57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Public Sans', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">
      CREA-PI
    </text>
  </g>
</svg>

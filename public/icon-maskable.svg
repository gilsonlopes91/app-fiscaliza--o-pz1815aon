<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ea6"/>
      <stop offset="50%" stop-color="#004B8D"/>
      <stop offset="100%" stop-color="#002d57"/>
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B82A"/>
      <stop offset="100%" stop-color="#D99B09"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background for safe area masking (no rounded corners) -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Scaled content centered strictly within 80% safe zone (radius < 204px) -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <!-- Main Shield -->
    <path d="M 256 70 
             L 380 120 
             C 380 240, 325 340, 256 390 
             C 187 340, 132 240, 132 120 
             Z" 
          fill="#ffffff" />
    
    <path d="M 256 90 
             L 362 132 
             C 362 236, 314 324, 256 370 
             C 198 324, 150 236, 150 132 
             Z" 
          fill="#004B8D" />

    <!-- Golden checkmark -->
    <path d="M 210 230 L 246 266 L 306 194" stroke="url(#goldGradMask)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

    <!-- CREA-PI Badge Banner -->
    <g transform="translate(256, 432)">
      <rect x="-140" y="-22" width="280" height="44" rx="22" fill="url(#goldGradMask)"/>
      <text x="0" y="7" fill="#002D57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Public Sans', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">
        CREA-PI
      </text>
    </g>
  </g>
</svg>

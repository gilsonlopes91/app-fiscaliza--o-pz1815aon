<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiscalização · CREA-PI (Offline)</title>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Public Sans', sans-serif;
        background-color: #f4f6f9;
        color: #102a43;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 4px 20px rgba(0, 75, 141, 0.08);
        border: 1px solid #d3dfe9;
        max-width: 440px;
        width: 100%;
        padding: 2rem;
        text-align: center;
      }
      .header-icon {
        width: 64px;
        height: 64px;
        background-color: #e8f1f8;
        color: #004b8d;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #004b8d;
        margin: 0 0 0.5rem 0;
      }
      p {
        font-size: 0.875rem;
        color: #486581;
        line-height: 1.5;
        margin: 0 0 1.5rem 0;
      }
      .btn {
        background-color: #004b8d;
        color: #ffffff;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 0.5rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #003666;
      }
      .badge {
        display: inline-block;
        background-color: #fef3c7;
        color: #92400e;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#004B8D"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M22.65 14.39 12 22.13 1.35 14.39a.84.84 0 0 1-.35-.68V4a2 2 0 0 1 2-2h18a2 2 0 0 1 2 2v9.71c0 .26-.13.52-.35.68Z"
          />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
      </div>
      <div class="badge">Modo Sem Conexão</div>
      <h1>Sem conexão à internet</h1>
      <p>
        Você está navegando desconectado. O aplicativo Fiscalização CREA-PI continuará funcionando
        com os dados e telas salvos no seu dispositivo assim que a conexão for restabelecida.
      </p>
      <button class="btn" onclick="window.location.reload()">Tentar reconectar</button>
    </div>
  </body>
</html>
